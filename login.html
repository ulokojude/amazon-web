<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/styles/trans.css">
    <title>Login | GrabBoss</title>
  </head>
  <body>
    <div class="container min-vh-100 d-flex align-items-center">
      <div class="row justify-content-center w-100">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
          <div class="card signup-card shadow">
            <div class="card-body p-4">
              <h3 class="text-center mb-2">Welcome Back</h3>
              <p class="text-center text-muted mb-4">Login to continue sohpping</p>
              <form action="/backend/php_backend/login.php" id="loginForm">
                <!-- Email -->
                <div class="mb-3">
                  <label for="" class="form-label">Email Adress</label>
                  <input type="email" class="form-control" placeholder="yours@email.com" required>
                </div>
                <!-- Password -->
                <div class="mb-3">
                  <label for="" class="form-label">Password</label>
                  <div class="input-group">
                    <input type="password" id="password" class="form-control" placeholder="********" required>
                    <span class="input-group-text password-toggle" onclick="togglePassword()">eye icon</span>
                  </div>
                </div>
                <!-- Remember + Forgot -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label for="" class="form-check-label" form="rememberMe">Remember me</label>
                  </div>
                  <a href="/fogot_pw1.html" class="text-decoration-none">Forgot Password</a>
                </div>
                <!-- Submit -->
                <div class="d-grid mb-3">
                  <button class="btn btn-primary btn-lg">Login</button>
                </div>
                <!-- Signup -->
                <p class="text-center mb-0">
                  Don't have an account?
                  <a href="create_acc.html">Create one</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src=""></script>
    <script>
    function togglePassword() {
      const password = document.getElementById("password");
      password.type = password.type === "password" ? "text" : "password";
    }
      document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();

        // Submit to backend
        alert("Login successfull!");
      })
    </script>
  </body>
</html>
