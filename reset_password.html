<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/styles/trans.css">
    <title>Document</title>
    <style>
      body {
        background-color: #f8f9fa;
      }
      .reset-card {
        border-radius: 14px;
      }
      .password-toggle {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container min-vh-100 d-flex align-items-center">
      <div class="row justify-content-center w-100">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
          <div class="card reset-card shadow">
            <div class="card-body p-4">
              <h3 class="text-center mb-2">Reset Password | GrabBoss</h3>
              <p class="text-center text-muted mb-4">Create a secure password</p>
              <form action="/backend/php_backend/pw_reset.php" method="post">
                <!-- NEw password -->
                <div class="mb-3">
                  <label for="" class="form-label">New Password</label>
                  <div class="input-group">
                    <input type="password" id="password" class="form-control" placeholder="*******" required>
                    <span class="input-group-text password-toggle" onclick="togglePassword('password')">eye icon</span>
                  </div>
                </div>
                <!-- Confirm Password -->
                <div class="mb-3">
                  <label for="" class="form-label">Confirm Password</label>
                  <div class="input-group">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="********" required>
                    <span class="input-group-text password-toggle" onclick="togglePassword('confirmPassword')">eye icon</span>
                  </div>
                </div>
                <!-- Error message -->
                <div id="error" class="alert alert-danger d-none">Password do not match</div>
                <!-- Submit -->
                <div class="d-grid mb-3">
                  <button type="submit" class="btn btn-primary btn-lg">Reset Password</button>
                </div>
                <p class="text-center mb-0">
                  <a href="login.html" class="text-decoration-none">Back to Login</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src=""></script>
    <script>
      function togglePassword(id) {
        const input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
      }
      document.getElementById("resetForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const error = document.getElementById("error");
        if (password !== confirmPassword) {
          error.classList.remove(d-none);
          // Submit to backend
          alert("Password reset successful!");
        }
      })
    </script>
  </body>
</html>
